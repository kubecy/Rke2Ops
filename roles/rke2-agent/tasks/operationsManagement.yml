---
- name: 更新 {{ global.k8s_user.user }} 用户的 K8S 环境变量块
  blockinfile:
    path: /home/{{ global.k8s_user.user }}/.bashrc
    marker: "# {mark} ANSIBLE K8S ENV"
    block: |
      PS1='\[\e[35m\]\u\[\e[m\]\[\e[97m\]\[\e[m\]\[\e[36m\]@\h\[\e[m\] \[\e[33m\]$(pwd):~\[\e[m\]\[\e[34m\] $\[\e[m\] '
      export PATH=$PATH:{{ global.rke2_data_dir }}/bin/
      source <(crictl completion bash)
    owner: "{{ global.k8s_user.user }}"
    group: "{{ global.k8s_user.group }}"
    mode: '0644'

- name: 加载 {{ global.k8s_user.user }} 用户的环境变量
  shell: source /home/{{ global.k8s_user.user }}/.bashrc
  args:
    executable: /bin/bash

- name: worker 节点设置 node-role 标签
  vars:
    ansible_become_pass: "{{ servers[groups['rke2_server'][0]].sudopass | b64decode }}"
  shell: |
    export KUBECONFIG=/home/{{ global.k8s_user.user }}/.kube/config
    export PATH=$PATH:{{ global.rke2_data_dir }}/bin
    kubectl label node {{ item }} node-role.kubernetes.io/worker=true --overwrite
  loop: "{{ groups['rke2_agent'] }}"
  delegate_to: "{{ groups['rke2_server'][0] }}"
  run_once: true

- name: 检查 cilium-ipsec-keys Secret 是否已存在
  vars:
    ansible_become_pass: "{{ servers[groups['rke2_server'][0]].sudopass | b64decode }}"
  command: >
    kubectl get secret -n kube-system cilium-ipsec-keys
  delegate_to: "{{ groups['rke2_server'][0] }}"
  run_once: true
  register: check_ipsec_secret
  ignore_errors: true
  changed_when: false
  when:
    - rke2_server.cilium.encryption.enabled | default(false) | bool
    - rke2_server.cilium.encryption.type | default('') == 'ipsec'
   
- name: 创建 cilium-ipsec-keys Secret
  vars:
    ansible_become_pass: "{{ servers[groups['rke2_server'][0]].sudopass | b64decode }}"
  shell: |
    export KUBECONFIG=/home/{{ global.k8s_user.user }}/.kube/config
    export PATH=$PATH:{{ global.rke2_data_dir }}/bin
    kubectl create -n kube-system secret generic cilium-ipsec-keys \
      --from-literal=keys="3+ rfc4106(gcm(aes)) $(dd if=/dev/urandom count=20 bs=1 2> /dev/null | xxd -p -c 64) 128"
  delegate_to: "{{ groups['rke2_server'][0] }}"
  run_once: true
  register: ipsec_secret_create
  when:
    - rke2_server.cilium.encryption.enabled | default(false) | bool
    - rke2_server.cilium.encryption.type | default('') == 'ipsec'
    - check_ipsec_secret is failed

- name: 给Gateway API节点打上node标签 role=infra,component=gateway-api
  shell: |
    export KUBECONFIG=/home/{{ global.k8s_user.user }}/.kube/config
    export PATH=$PATH:{{ global.rke2_data_dir }}/bin
    kubectl label node {{ item }} role=infra component=gateway-api --overwrite
  loop: "{{ groups['gateway_infra_nodes'] }}"
  delegate_to: "{{ groups['rke2_server'][0] }}"
  vars:
    ansible_become_pass: "{{ servers[groups['rke2_server'][0]].sudopass | b64decode }}"
  run_once: true
  when:
    - rke2_server.cilium.gatewayAPI.enabled | default(false) | bool
    - rke2_server.cilium.gatewayAPI.hostNetwork.enabled | default(false) | bool

- name: 创建 Gateway-API CRDs 远程目录
  file:
    path: /app/yaml/Gateway-API-CRDs/v1.4.1
    state: directory
    owner: root
    group: root
    mode: '0755'
  become: true
  delegate_to: "{{ groups['rke2_server'][0] }}"
  run_once: true
  vars:
    ansible_become_pass: "{{ servers[groups['rke2_server'][0]].sudopass | b64decode }}"
  when:
    - rke2_server.cilium.gatewayAPI.enabled | default(false) | bool

- name: 上传 Gateway-API CRDs 清单
  copy:
    src: gateway-api/{{ rke2_server.cilium.gateway_api_version }}/
    dest: /app/yaml/Gateway-API-CRDs/{{ rke2_server.cilium.gateway_api_version }}/
    owner: root
    group: root
    mode: '0644'
    directory_mode: '0755'
  become: true
  delegate_to: "{{ groups['rke2_server'][0] }}"
  run_once: true
  vars:
    ansible_become_pass: "{{ servers[groups['rke2_server'][0]].sudopass | b64decode }}"
  when:
    - rke2_server.cilium.gatewayAPI.enabled | default(false) | bool

- name: 应用 Gateway-API CRDs 清单
  shell: |
    export KUBECONFIG=/home/{{ global.k8s_user.user }}/.kube/config
    export PATH=$PATH:{{ global.rke2_data_dir }}/bin
    kubectl apply -f /app/yaml/Gateway-API-CRDs/{{ rke2_server.cilium.gateway_api_version }}/
  delegate_to: "{{ groups['rke2_server'][0] }}"
  run_once: true
  vars:
    ansible_become_pass: "{{ servers[groups['rke2_server'][0]].sudopass | b64decode }}"
  register: gateway_crd_apply
  changed_when: "'created' in gateway_crd_apply.stdout or 'configured' in gateway_crd_apply.stdout"
  when:
    - rke2_server.cilium.gatewayAPI.enabled | default(false) | bool

- name: 重启 cilium-operator、cilium DaemonSet 加载 Gateway API CRDs
  shell: |
    export KUBECONFIG=/home/{{ global.k8s_user.user }}/.kube/config
    export PATH=$PATH:{{ global.rke2_data_dir }}/bin
    kubectl -n kube-system rollout restart deployment/cilium-operator
    kubectl -n kube-system rollout restart ds/cilium
  delegate_to: "{{ groups['rke2_server'][0] }}"
  run_once: true
  vars:
    ansible_become_pass: "{{ servers[groups['rke2_server'][0]].sudopass | b64decode }}"
  when:
    - rke2_server.cilium.gatewayAPI.enabled | default(false) | bool
