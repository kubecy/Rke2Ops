apiVersion: apps/v1
kind: Deployment
metadata:
  name: demoapp
  namespace: default
  labels:
    app: demoapp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: demoapp
  template:
    metadata:
      labels:
        app: demoapp
    spec:
      containers:
      - name: demoapp
        image: registry.cn-guangzhou.aliyuncs.com/kansctl/demoapp:v1.0
        ports:
        - containerPort: 8080
        resources:
          limits:
            cpu: "200m"
            memory: "512Mi"
          requests:
            cpu: "50m"
            memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: demoapp-svc
  namespace: default
spec:
  selector:
    app: demoapp
  ports:
  - port: 80
    targetPort: 8080
  type: ClusterIP
